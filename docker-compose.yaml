# ──────────────────────────────────────────────────────────────────────
#  OmniRoute for Coolify
#  Image:  https://hub.docker.com/r/diegosouzapw/omniroute
#  Source: https://github.com/diegosouzapw/OmniRoute
#
#  Deploy: Coolify project → New Resource → Public Repository, this repo,
#  build pack "Docker Compose". That path lets Coolify inject the public
#  URL itself. The file is named .yaml on purpose: Coolify's Compose file
#  field defaults to /docker-compose.yaml and it reads that path literally.
#
#  Needs Coolify v4.0.0-beta.420.7 or newer. Older releases parse
#  SERVICE_URL_* differently and hand the app a schemeless origin, which
#  OmniRoute rejects at startup.
#
#  Coolify generates every SERVICE_* secret once and reuses it on later
#  deploys, so redeploying will not rotate the database encryption key.
#
#  The app serves the dashboard and the API together on port 20128.
#  Data lives in the `omniroute-data` volume.
# ──────────────────────────────────────────────────────────────────────

services:
  omniroute:
    # Pinned deliberately. `latest` once moved to a build that crashed on
    # startup (3.8.45/3.8.46, fixed in 3.8.47). Bump this line when you
    # have decided to upgrade, do not inherit a surprise.
    # The `-web` variant bundles Chromium and is larger (1.67 GB against
    # 1.24 GB of compressed layers for 3.8.50 on amd64). It is needed ONLY
    # for web-cookie providers (gemini-web, claude-web, claude-turnstile).
    image: diegosouzapw/omniroute:3.8.50
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - omniroute-data:/app/data
    environment:
      # ── ROUTING ──
      - SERVICE_FQDN_OMNIROUTE_20128

      # ── SECRETS, generated by Coolify on first deploy ──
      # Do not put an underscore in the name after the generator prefix:
      # Coolify parses these by counting underscores and an extra one
      # silently changes which generator runs.
      #
      # Signs dashboard session cookies. 64 random characters.
      - JWT_SECRET=${SERVICE_BASE64_64_JWTSECRET}
      # HMAC secret behind the issued API key format
      # sk-{machineId}-{keyId}-{crc8}. It does not encrypt anything.
      # 64 hex chars. Left to the image, the bootstrap would generate one
      # into the data volume; letting Coolify own it keeps it visible and
      # backed up with the rest of your deployment config.
      - API_KEY_SECRET=${SERVICE_HEX_64_APIKEYSECRET}
      # Field-level AES-256-GCM encryption of stored provider credentials
      # and tokens, not of the database as a whole.
      # Back this value up and do not change it: 3.8.50 ships no
      # re-encryption path, so a new key makes stored credentials
      # undecryptable. Coolify keeps it across redeploys.
      - STORAGE_ENCRYPTION_KEY=${SERVICE_HEX_64_STORAGEKEY}
      # Initialized and persisted by the image bootstrap, but no encryption
      # or decryption path reads it. Bumping it rotates nothing.
      - STORAGE_ENCRYPTION_KEY_VERSION=v1
      # Authenticates the internal WebSocket bridge. Upstream marks this
      # required in production: unset means every bridge request is
      # rejected. Real base64 of 32 random bytes.
      - OMNIROUTE_WS_BRIDGE_SECRET=${SERVICE_REALBASE64_WSBRIDGE}
      # First dashboard login. Read the value in Coolify under
      # Environment Variables, then change it in Settings → Security.
      - INITIAL_PASSWORD=${SERVICE_PASSWORD_OMNIROUTE}
      # Machine fingerprint salt, unique per deployment.
      - MACHINE_ID_SALT=${SERVICE_BASE64_MACHINESALT}

      # ── PUBLIC URL, injected by Coolify ──
      # Deploy this repo with the Docker Compose build pack and Coolify
      # derives this from the service's Domains entry: it keeps the scheme
      # and strips the routing port, and refreshes the value whenever you
      # change the domain. You get https://your-domain.com, which is what
      # OAuth callbacks and dashboard links need.
      #
      # Pasting this file as "Docker Compose Empty" instead goes through a
      # different parser that stores this WITHOUT a scheme. On that path,
      # edit the line below to a literal https://your-domain.com before
      # creating the resource. Setting NEXT_PUBLIC_BASE_URL in the
      # Environment Variables UI does NOT override it: the compose mapping
      # still resolves from SERVICE_URL_OMNIROUTE and wins.
      - NEXT_PUBLIC_BASE_URL=${SERVICE_URL_OMNIROUTE}

      # ── NETWORK ──
      - PORT=${PORT:-20128}
      # Forces the Secure flag on session cookies. Keep this
      # true behind TLS, and false only on plain HTTP.
      - AUTH_COOKIE_SECURE=false
      - BASE_URL=http://127.0.0.1:20128

      # ── SECURITY ──
      # Anything reachable from the internet should not proxy anonymously.
      # Create keys in Dashboard → API Keys.
      - REQUIRE_API_KEY=true
      - ALLOW_API_KEY_REVEAL=false
      # 5 MB, upstream's hardening recommendation (default is 10 MB).
      - MAX_BODY_SIZE_BYTES=5242880

      # ── STORAGE ──
      - DATA_DIR=/app/data
      - DISABLE_SQLITE_AUTO_BACKUP=false

      # ── REDIS ──
      # Rate limiter and shared cache. Drop this together with the redis
      # service to fall back to the in-memory limiter.
      - REDIS_URL=redis://redis:6379

      # ── OPTIONAL ──
      # Heap default is 1024 MB. Raise both together, and give the host
      # the RAM to match:
      # - OMNIROUTE_MEMORY_MB=2048
      # - NODE_OPTIONS=--max-old-space-size=2048
      # - APP_LOG_LEVEL=info
      # - TZ=Europe/Warsaw
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  omniroute-data:
  redis-data:
